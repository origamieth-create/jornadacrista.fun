<script>
// Oferta con fecha real (vacío = barra oculta)
var OFFER_END = ""; // ej: "2026-10-31T23:59:00-03:00"
(function(){
  if(!OFFER_END) return;
  var end = new Date(OFFER_END).getTime(), bar = document.getElementById("offer");
  if(isNaN(end)) return;
  document.getElementById("offerDate").textContent = new Date(end).toLocaleDateString("es",{day:"numeric",month:"long"});
  function tick(){
    var d = end - Date.now();
    if(d <= 0){bar.style.display="none";return;}
    var h = Math.floor(d/36e5), m = Math.floor(d%36e5/6e4), s = Math.floor(d%6e4/1e3);
    document.getElementById("count").textContent = (h>=24?Math.floor(h/24)+"d ":"")+(h%24)+"h "+m+"m "+s+"s";
    bar.style.display="block"; setTimeout(tick,1000);
  }
  tick();
})();
</script>
